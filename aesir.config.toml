# ═══════════════════════════════════════════════════════════════════════════════
# Project A.E.S.I.R. Configuration Manifest (aesir.config.toml)
# ═══════════════════════════════════════════════════════════════════════════════

[hardware]
# Acceleration backend: auto | cuda | metal | intel | amd | npu | cpu | max
acceleration_backend = "auto"
# Number of layers to offload (-1 = all available layers)
num_gpu_layers = -1
# CPU thread pool limit (0 = auto-detect max cores)
max_threads = 0

[safety]
# SKÁLDBRØÐIR — The Doom Loop Annihilation Protocol (Repetition & Entropy guard)
skaldbrodir_enabled = true
# Thinking mode control (Hard suppression of thought tokens when false)
thinking_enabled = true

[experimental_paradigms]
# CIA: Cognitive Inference Architecture (Episodic Computation Memory)
cia_enabled = false
# WIC: Wave Inference Computing (Holographic Wavefront Interference)
wic_enabled = false
# NSFI: Neural Spectral Fractal Inference (Fractal Attractor Weight Encoding)
nsfi_enabled = false

[interface]
# Enable Rich Terminal Monitoring Dashboard (TUI)
tui_enabled = false

[sampling]
temperature = 0.7
top_p = 0.9
