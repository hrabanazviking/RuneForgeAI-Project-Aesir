name: Project Aesir CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.40.0
          cache: true

      - name: Run Master Test Suite
        run: pixi run mojo run aesir_engine/tests/run_all.mojo

      - name: Check Documentation Drift
        run: python3 scripts/check_doc_drift.py
