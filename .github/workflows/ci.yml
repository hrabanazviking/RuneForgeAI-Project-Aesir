name: Project Aesir CI

on:
  push:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          cache: true

      - name: Run Master Test Suite
        # Hosted runners have no GPU to detect. Compile the tested Ada target;
        # physical inference remains an explicit opt-in hardware test.
        run: pixi run mojo run --target-accelerator sm_89 aesir_engine/tests/run_all.mojo

      - name: Build Native CLI
        run: pixi run mojo build --target-accelerator sm_89 aesir_engine/main.mojo -o /tmp/aesir-ci-build

      - name: Prove Fail-Closed Test Semantics
        shell: bash
        run: |
          if pixi run mojo run --target-accelerator sm_89 aesir_engine/tests/test_fail_closed_runner.mojo > /tmp/aesir-negative-control.log 2>&1; then
            echo "negative control unexpectedly succeeded"
            exit 1
          fi
          if ! grep -q "negative_control.intentional_failure" /tmp/aesir-negative-control.log; then
            cat /tmp/aesir-negative-control.log
            echo "negative control failed for an unrelated reason"
            exit 1
          fi

      - name: Prove Repository Artifact Prevention
        run: python3 scripts/test_check_doc_drift.py

      - name: Prove Fixture Provenance Policy
        run: |
          python3 scripts/test_fixture_manifest.py
          python3 scripts/check_fixture_manifest.py

      - name: Check Repository Consistency
        run: python3 scripts/check_doc_drift.py

      - name: Check Published Native Stheno Conversation
        run: python3 scripts/check_stheno_conversation.py docs/evidence/stheno-roleplay-20.md
